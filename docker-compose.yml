version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-rag
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:latest
    container_name: neo4j-rag
    environment:
      NEO4J_AUTH: neo4j/rag-neo4j-password-2024
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "rag-neo4j-password-2024", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # RAG AI Agent API (optional - can also run locally)
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override database connections to use service names
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/rag
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./ui:/app/ui  # Mount UI files
      - ./uploads:/app/uploads  # For document uploads (optional)
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - rag-network
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

networks:
  rag-network:
    driver: bridge
