# ============================================
# RAG AI Agent - Full Stack Docker Compose
# ============================================
# This file runs the complete system:
#   - PostgreSQL with pgvector (vector database)
#   - Neo4j (graph database)
#   - RAG API server (FastAPI application)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove data
#
# Access:
#   - Web UI: http://localhost:8000/
#   - API Docs: http://localhost:8000/docs
#   - Neo4j Browser: http://localhost:7474/
#
# IMPORTANT: Before running, create .env file:
#   cp .env.example .env
#   # Edit .env with your AWS and SERPAPI credentials
# ============================================

services:
  # PostgreSQL with pgvector extension for vector similarity search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-rag
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network
    restart: unless-stopped

  # Neo4j Graph Database for entity-relationship storage
  neo4j:
    image: neo4j:5
    container_name: neo4j-rag
    environment:
      NEO4J_AUTH: neo4j/rag-neo4j-password-2024
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # HTTP (Neo4j Browser)
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "rag-neo4j-password-2024", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - rag-network
    restart: unless-stopped

  # RAG API Server (FastAPI + Docling + Claude + Titan)
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override database connections to use Docker network names
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/rag
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: rag-neo4j-password-2024
      NEO4J_USERNAME: neo4j
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --log-level info

volumes:
  postgres_data:
    name: rag-postgres-data
  neo4j_data:
    name: rag-neo4j-data
  neo4j_logs:
    name: rag-neo4j-logs

networks:
  rag-network:
    name: rag-network
    driver: bridge
